services:
  postgres:
    image: postgres:16-alpine
    container_name: devboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
      POSTGRES_DB: devboard
    ports:
      - '5432:5432'
    volumes:
      - devboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devboard -d devboard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devboard-postgres:
